<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Join The Highlands 2027</title>
<meta name="description" content="Support your neighborhood in 2027 and join The Highlands Neighborhood Association, Carrollton TX.">
<meta property="og:title" content="Join The Highlands Neighborhood Association — 2027">
<meta property="og:description" content="Support your neighborhood in 2027. Sign up in under a minute.">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Lato:wght@400;700;900&display=swap">
<style>
:root{
  color-scheme: light;
  --navy:#1B2D44; --navy-2:#27405F; --gold:#C9A043; --gold-soft:#F4E6C2;
  --muted:#8391A3; --line:#D9DDE3; --red:#B43333; --green:#2D6A4F;
  --script:'Great Vibes',cursive; --serif:'Playfair Display',Georgia,serif; --sans:'Lato',system-ui,sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{background:#fff}
body{font-family:var(--sans);color:var(--navy);-webkit-font-smoothing:antialiased}
.page{max-width:520px;margin:0 auto;min-height:100svh;display:flex;flex-direction:column}
main{padding:clamp(12px,2.2svh,28px) 22px 0}


/* headline — the star */
h1{text-align:center;font-family:var(--serif);font-weight:900;line-height:1.02;
   font-size:clamp(1.7rem,7.9vw,2.6rem);letter-spacing:-.01em;margin:0 0 clamp(8px,1.8svh,22px)}
h1 span{display:block;opacity:0;transform:translateY(10px);animation:up .6s cubic-bezier(.2,.7,.2,1) forwards}
h1 span:nth-child(2){animation-delay:.12s} h1 span:nth-child(3){animation-delay:.24s}
.yr{position:relative;color:var(--gold);font-style:italic;padding:0 .08em;white-space:nowrap}
h1 .lg img{display:block;margin:.22em auto 0;width:min(58%,290px);height:auto}
@keyframes up{to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){h1 span{animation:none;opacity:1;transform:none}}

/* fields */
form{display:grid;gap:clamp(4px,1svh,10px)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
input[type=text],input[type=tel],input[type=email]{
  width:100%;height:clamp(36px,5.4svh,46px);border:none;border-bottom:1.5px solid var(--line);background:transparent;
  font:400 1rem var(--sans);color:var(--navy);border-radius:0;-webkit-appearance:none;padding:0 2px;transition:border-color .15s}
input::placeholder{color:var(--muted)}
input:focus{outline:none;border-bottom-color:var(--navy)}
input.err{border-bottom-color:var(--red)} input.err::placeholder{color:var(--red)}
#adult2{display:grid;gap:inherit}
#adult2[hidden]{display:none}

.extras{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:6px;flex-wrap:nowrap}
.chip{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:#fff;color:var(--navy);
  border-radius:999px;padding:6px 11px;font:700 .76rem var(--sans);white-space:nowrap;cursor:pointer;transition:all .15s}
.chip[aria-pressed=true]{background:var(--navy);border-color:var(--navy);color:#fff}
.kids{display:flex;align-items:center;gap:6px;font-size:.76rem;font-weight:700;white-space:nowrap}
.step{display:inline-flex;align-items:center;border:1.5px solid var(--line);border-radius:999px;overflow:hidden}
.step button{width:28px;height:28px;border:none;background:#fff;color:var(--navy);font:900 1rem var(--sans);cursor:pointer}
.step button:active{background:var(--gold-soft)}
.step output{min-width:26px;text-align:center;font-weight:900}

.go{margin-top:clamp(6px,1.2svh,12px);height:46px;border:none;border-radius:999px;background:var(--navy);color:#fff;
  font:900 .86rem var(--sans);letter-spacing:.14em;text-transform:uppercase;cursor:pointer;transition:background .15s,transform .1s}
.go:hover{background:var(--navy-2)} .go:active{transform:scale(.98)}

/* success */
#done{text-align:center;padding-top:6px}
#done h2{font-family:var(--serif);font-weight:900;font-size:1.6rem;margin-bottom:6px}
#done p{color:var(--muted);font-size:.9rem;margin-bottom:14px}
#done pre{text-align:left;background:#F6F5F1;border-radius:10px;padding:14px;font-size:.74rem;line-height:1.6;white-space:pre-wrap;max-height:34svh;overflow:auto;margin-bottom:12px}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.ghost{height:42px;padding:0 18px;border-radius:999px;border:1.5px solid var(--line);background:#fff;color:var(--navy);font:700 .8rem var(--sans);cursor:pointer}
.solid{height:42px;padding:0 18px;border-radius:999px;border:none;background:var(--navy);color:#fff;font:700 .8rem var(--sans);cursor:pointer}
.solid.ok{background:var(--green)}

/* photo footer w/ copyright */
.photo{position:relative;margin-top:clamp(10px,1.8svh,22px);height:var(--ph,62vw);min-height:130px;overflow:hidden;flex:none}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 30%}
.photo::after{content:"";position:absolute;inset:auto 0 0 0;height:38%;background:linear-gradient(to top,rgba(10,20,34,.78),transparent)}
.copy{position:absolute;left:0;right:0;bottom:8px;z-index:1;text-align:center;color:rgba(255,255,255,.9);font-size:.62rem;letter-spacing:.06em;padding:0 10px;white-space:nowrap}
@media (min-width:560px){.page{padding-top:24px}.photo{border-radius:14px 14px 0 0}}
</style>

</head>

<script>
(()=>{
  const $=id=>document.getElementById(id);
  const TO='president@highlandshna.com';
  let kids=0;
  // size photo to fill the rest of the screen (capped so the sign isn't cropped)
  const fit=()=>{const ph=document.querySelector('.photo');const top=ph.getBoundingClientRect().top+scrollY;
    const w=ph.clientWidth, ideal=w*0.629, room=innerHeight-top;
    ph.style.setProperty('--ph',(w>=500?ideal:Math.max(130,Math.min(ideal,room)))+'px');};
  addEventListener('resize',fit);addEventListener('load',fit);document.fonts&&document.fonts.ready.then(fit);fit();

  $('add').onclick=e=>{const on=e.currentTarget.getAttribute('aria-pressed')!=='true';
    e.currentTarget.setAttribute('aria-pressed',on);e.currentTarget.textContent=on?'✓ Another adult':'+ Another adult';
    $('adult2').hidden=!on;if(on)$('n2').focus();fit();};
  $('km').onclick=()=>{kids=Math.max(0,kids-1);$('kn').textContent=kids};
  $('kp').onclick=()=>{kids=Math.min(12,kids+1);$('kn').textContent=kids};
  ['n1','p1','e1','addr'].forEach(id=>$(id).addEventListener('input',e=>e.target.classList.remove('err')));

  $('f').onsubmit=e=>{
    e.preventDefault();
    const v=id=>$(id).value.trim();let bad=null;
    ['n1','p1','e1','addr'].forEach(id=>{const ok=id==='e1'?/^\S+@\S+\.\S+$/.test(v(id)):!!v(id);
      if(!ok){$(id).classList.add('err');bad=bad||$(id);}});
    if(bad){bad.focus();return;}
    const L='-'.repeat(34);
    let t=`HNA 2027 MEMBERSHIP\n${new Date().toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'})}\n${L}\nName:    ${v('n1')}\nPhone:   ${v('p1')}\nEmail:   ${v('e1')}\nAddress: ${v('addr')}\n`;
    if($('add').getAttribute('aria-pressed')==='true'&&(v('n2')||v('p2')||v('e2')))
      t+=`${L}\nSECOND ADULT\nName:    ${v('n2')}\nPhone:   ${v('p2')}\nEmail:   ${v('e2')}\n`;
    t+=`${L}\nChildren under 18: ${kids}`;
    $('sum').textContent=t;
    location.href=`mailto:${TO}?subject=${encodeURIComponent('HNA 2027 Membership — '+v('n1'))}&body=${encodeURIComponent(t)}`;
    $('f').hidden=true;$('done').hidden=false;fit();
  };
  $('cp').onclick=()=>{navigator.clipboard.writeText($('sum').textContent).then(()=>{$('cp').textContent='Copied!';$('cp').classList.add('ok');
    setTimeout(()=>{$('cp').textContent='Copy';$('cp').classList.remove('ok')},2200)}).catch(()=>{})};
  $('bk').onclick=()=>{$('done').hidden=true;$('f').hidden=false;fit();};
})();
</script>
