<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR Code — Home Valuation Landing Page</title>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #0b0b0b;
    color: #fff;
    margin: 0;
    padding: 40px 20px;
    text-align: center;
  }
  h1 { font-size: 20px; margin-bottom: 4px; }
  p.sub { color: #bdbdbd; font-size: 13.5px; margin-top: 0; margin-bottom: 28px; }
  .panel {
    max-width: 420px;
    margin: 0 auto;
    background: #161616;
    border: 1px solid #2a2a2a;
    border-radius: 14px;
    padding: 26px;
  }
  label { display: block; text-align: left; font-size: 12px; font-weight: 600; margin-bottom: 6px; color: #ddd; }
  input[type=text] {
    width: 100%;
    padding: 11px 13px;
    font-size: 14px;
    border-radius: 8px;
    border: 1px solid #3a3a3a;
    background: #0b0b0b;
    color: #fff;
    box-sizing: border-box;
    margin-bottom: 18px;
  }
  #qrCanvas {
    background: #fff;
    padding: 16px;
    border-radius: 10px;
    display: inline-block;
    margin-bottom: 18px;
  }
  button {
    background: #b8102e;
    color: #fff;
    border: none;
    padding: 12px 18px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    width: 100%;
  }
  button:hover { background: #d81f3b; }
  .hint { font-size: 11.5px; color: #8a8a8a; margin-top: 14px; }
</style>
</head>
<body>

  <h1>Home Valuation — QR Code Generator</h1>
  <p class="sub">Generates a printable QR code that opens the landing page. Runs entirely in your browser — nothing is uploaded anywhere.</p>

  <div class="panel">
    <label for="pageUrl">Landing page URL</label>
    <input type="text" id="pageUrl" value="https://txasc.github.io/DONNA-M/home-valuation/">

    <div id="qrCanvas"></div>

    <button id="downloadBtn">Download PNG</button>
    <p class="hint">Pre-filled with the live page URL. A print-ready copy is also in assets/home-valuation-qr.png and .svg.</p>
  </div>

<script>
  var canvasHolder = document.getElementById('qrCanvas');
  var urlInput = document.getElementById('pageUrl');
  var downloadBtn = document.getElementById('downloadBtn');
  var canvas = document.createElement('canvas');
  canvasHolder.appendChild(canvas);

  function render() {
    QRCode.toCanvas(canvas, urlInput.value || " ", { width: 320, margin: 2 }, function (err) {
      if (err) console.error(err);
    });
  }

  urlInput.addEventListener('input', render);
  downloadBtn.addEventListener('click', function () {
    var link = document.createElement('a');
    link.download = 'home-valuation-qr.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
  });

  render();
</script>

</body>
</html>
