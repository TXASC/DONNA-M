<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#b40101">
<title>What's My Home Worth? | Mallory Adams, REALTOR&reg;</title>
<meta name="description" content="Free home valuation from Mallory Adams, REALTOR&reg;, Keller Williams Dallas Preston Road.">
<link rel="preload" as="image" href="assets/mallory-headshot.webp">
<style>
  :root {
    --kw-red: #b40101;
    --kw-red-dark: #8f0101;
    --black: #0b0b0b;
    --ink: #1a1a1a;
    --line: #d6d6d6;
    --field-bg: #f6f6f6;
    --frame: 8px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--ink);
    background: var(--kw-red);
    -webkit-text-size-adjust: 100%;
  }

  /* KW-red border around the entire page */
  .frame {
    min-height: 100vh;
    min-height: 100dvh;
    border: var(--frame) solid var(--kw-red);
    background: #fff;
    display: flex;
    flex-direction: column;
  }

  h1 {
    margin: 0;
    padding: 40px 20px 8px;
    text-align: center;
    font-size: clamp(30px, 8.5vw, 48px);
    line-height: 1.1;
    font-weight: 800;
    letter-spacing: -0.01em;
    color: var(--black);
  }
  h1 span { color: var(--kw-red); }

  form {
    width: 100%;
    max-width: 460px;
    margin: 0 auto;
    padding: 20px 20px 36px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }
  input, select {
    width: 100%;
    font: inherit;
    font-size: 16px; /* 16px stops iOS from zooming into the field */
    padding: 15px 14px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--field-bg);
    color: var(--ink);
    -webkit-appearance: none;
    appearance: none;
  }
  select {
    color: #757575;
    background-image: linear-gradient(45deg, transparent 50%, #757575 50%), linear-gradient(135deg, #757575 50%, transparent 50%);
    background-position: calc(100% - 20px) 50%, calc(100% - 14px) 50%;
    background-size: 6px 6px;
    background-repeat: no-repeat;
  }
  select.chosen { color: var(--ink); }
  input:focus, select:focus {
    outline: none;
    border-color: var(--kw-red);
    background-color: #fff;
    box-shadow: 0 0 0 3px rgba(180, 1, 1, 0.15);
  }
  .hp { position: absolute; left: -9999px; width: 1px; height: 1px; opacity: 0; }

  button {
    margin-top: 4px;
    width: 100%;
    font: inherit;
    font-size: 17px;
    font-weight: 700;
    padding: 16px;
    border: 0;
    border-radius: 8px;
    background: var(--kw-red);
    color: #fff;
    cursor: pointer;
  }
  button:hover { background: var(--kw-red-dark); }
  button:disabled { opacity: 0.7; cursor: default; }

  .msg { display: none; padding: 12px 14px; border-radius: 8px; font-size: 15px; text-align: center; }
  .msg.success { background: #eef8ef; color: #1e6b2a; }
  .msg.error { background: #fdeeee; color: var(--kw-red-dark); }
  .msg a { color: inherit; font-weight: 700; }

  /* Brand band: white KW logo + headshot on black */
  .brand {
    margin-top: auto;
    background: var(--black);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    gap: 16px;
    padding: 20px 16px 0;
  }
  .brand .logo {
    flex: 1 1 55%;
    max-width: 300px;
    align-self: center;
    padding-bottom: 12px;
  }
  .brand .logo img { display: block; width: 100%; height: auto; }
  .brand .headshot {
    flex: 1 1 45%;
    max-width: 240px;
    display: block;
    width: 45%;
    height: auto;
  }
  @media (min-width: 640px) {
    .frame { --frame: 12px; }
    h1 { padding-top: 56px; }
    .brand { gap: 48px; padding-top: 28px; }
  }
</style>
</head>
<body>
<div class="frame">

  <h1>What&rsquo;s My Home <span>Worth?</span></h1>

  <form id="valuationForm" autocomplete="on">
    <label class="sr-only" for="fullName">Full name</label>
    <input type="text" id="fullName" name="fullName" required placeholder="Full Name" autocomplete="name">

    <label class="sr-only" for="phone">Phone</label>
    <input type="tel" id="phone" name="phone" required placeholder="Phone" autocomplete="tel">

    <label class="sr-only" for="email">Email</label>
    <input type="email" id="email" name="email" required placeholder="Email" autocomplete="email">

    <label class="sr-only" for="address">Property address</label>
    <input type="text" id="address" name="address" required placeholder="Property Address" autocomplete="street-address">

    <label class="sr-only" for="timeframe">Selling timeframe</label>
    <select id="timeframe" name="timeframe">
      <option value="">Selling Timeframe</option>
      <option value="ASAP">ASAP</option>
      <option value="1-3 months">1&ndash;3 months</option>
      <option value="3-6 months">3&ndash;6 months</option>
      <option value="6-12 months">6&ndash;12 months</option>
      <option value="Just curious">Just curious</option>
    </select>

    <input type="text" id="website" name="website" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">

    <button type="submit" id="submitBtn">Get My Home Value</button>

    <div class="msg success" id="msgSuccess">Thank you! Mallory will be in touch shortly.</div>
    <div class="msg error" id="msgError">Opening your email app &mdash; just hit send. Or call Mallory at <a href="tel:9317034746">931.703.4746</a>.</div>
  </form>

  <footer class="brand">
    <div class="logo"><img src="assets/kw-logo-white.png" alt="Keller Williams Realty, Dallas Preston Road" width="768" height="240"></div>
    <img class="headshot" src="assets/mallory-headshot.webp" alt="Mallory Adams, REALTOR&reg;" width="640" height="762">
  </footer>

</div>

<script>
(function () {
  // Leads go to n8n on the JARVIS tower (via Tailscale Funnel), which emails
  // Mallory. If the webhook can't be reached, fall back to a pre-filled
  // email in the visitor's own mail app so the lead isn't lost.
  var N8N_WEBHOOK_URL = "https://jarvis.tailb14d90.ts.net/webhook/home-valuation";
  var MALLORY_EMAIL = "mallorya@kw.com";
  var BUTTON_TEXT = "Get My Home Value";

  var form = document.getElementById('valuationForm');
  var submitBtn = document.getElementById('submitBtn');
  var msgSuccess = document.getElementById('msgSuccess');
  var msgError = document.getElementById('msgError');
  var timeframe = document.getElementById('timeframe');

  timeframe.addEventListener('change', function () {
    timeframe.classList.toggle('chosen', !!timeframe.value);
  });

  function showMsg(el) {
    msgSuccess.style.display = 'none';
    msgError.style.display = 'none';
    el.style.display = 'block';
  }

  function buildMailto(data) {
    var subject = "New Home Valuation Request: " + data.fullName;
    var body = [
      "New home valuation lead from the landing page:",
      "",
      "Name: " + data.fullName,
      "Phone: " + data.phone,
      "Email: " + data.email,
      "Property Address: " + data.address,
      "Timeframe: " + (data.timeframe || "Not specified"),
      "",
      "Submitted: " + new Date().toLocaleString()
    ].join("\n");
    return "mailto:" + MALLORY_EMAIL +
      "?subject=" + encodeURIComponent(subject) +
      "&body=" + encodeURIComponent(body);
  }

  function resetButton() {
    submitBtn.disabled = false;
    submitBtn.textContent = BUTTON_TEXT;
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();

    var data = {
      fullName: document.getElementById('fullName').value.trim(),
      phone: document.getElementById('phone').value.trim(),
      email: document.getElementById('email').value.trim(),
      address: document.getElementById('address').value.trim(),
      timeframe: timeframe.value,
      notes: "",
      website: document.getElementById('website').value.trim(),
      source: "home-valuation-landing-page",
      submitted_at: new Date().toISOString()
    };

    submitBtn.disabled = true;
    submitBtn.textContent = "Sending…";

    fetch(N8N_WEBHOOK_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(data)
    })
      .then(function (res) {
        if (!res.ok) { throw new Error("Webhook returned " + res.status); }
        showMsg(msgSuccess);
        form.reset();
        timeframe.classList.remove('chosen');
        resetButton();
      })
      .catch(function () {
        showMsg(msgError);
        window.location.href = buildMailto(data);
        resetButton();
      });
  });
})();
</script>
</body>
</html>
